# A cada push na main: compila o Astro e grava o site pronto na branch "deploy".
# A Hostinger puxa a branch "deploy" (Git do hPanel) e publica em public_html.
name: Build e publicação

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Gravar o site pronto na branch deploy
        working-directory: dist
        run: |
          git init -b deploy
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Build de ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
